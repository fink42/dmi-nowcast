name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --- core library ---------------------------------------------------
      - name: Sync core environment
        run: uv sync --all-groups --frozen

      - name: Core suite
        run: uv run python -m pytest tests/ -q

      # --- sidecar service ------------------------------------------------
      - name: Sync sidecar environment
        working-directory: sidecar
        run: uv sync --all-groups --frozen

      - name: Sidecar suite
        working-directory: sidecar
        run: uv run python -m pytest tests/ -q

  frontend:
    name: frontend (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run check

      # The basemap archive is a ~147 MB build input fetched at deploy time
      # (frontend/scripts/fetch-basemap.mjs), deliberately not in CI: the build
      # only needs it to exist at serve time, not to compile.
      - name: Build
        run: npm run build
