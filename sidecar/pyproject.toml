[project]
name = "dmi-nowcast-sidecar"
version = "0.1.0"
description = "DMI rain-nowcast sidecar — Farnebäck flow + advection + STEPS over HTTP"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicolai Damslund" }
]
requires-python = ">=3.12"
dependencies = [
    "dmi-nowcast-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv.sources]
# Local-path link to the core library at the parent directory. On the
# deployment VM we'll instead install both packages from a source
# tarball, so this dev-time path is the only place that knows about
# the repo layout.
dmi-nowcast-core = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmi_nowcast_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
