# Public instance config — copy to config.public.yaml and edit.
#
# This is the internet-facing instance (website Phase C plan §P1/§P3). It
# serves the national products and the static site to anyone; it must not
# serve the per-point state block, the home crop frames, or the lightning
# endpoints. ``server.public_mode: true`` below is what enforces that.
#
# Any field can also be set via env vars with the DMI_NOWCAST_ prefix and
# __ as the nested separator; env beats YAML (see config.py).

home:
  # VESTIGIAL on a public instance. Nothing point-specific is published
  # here: /state.json (the block this point produces) is hidden, and the
  # site samples every forecast from the national grids instead. The point
  # still exists because the cycle computes one — its only public-facing
  # traces are the confidence scalar's intensity-volatility term and the
  # motion diagnostics, both of which a central point makes "typical
  # Denmark" rather than one corner of it.
  #
  # 56.0 N, 10.0 E — central Denmark (eastern Jutland, near the Kattegat
  # coast). Deliberately neutral: no one lives at a round coordinate.
  lat: 56.0
  lon: 10.0
  radius_km: 1.0

poll:
  # 2, not 5: DMI publishes a composite ~12 min after its timestamp and
  # the poll adds up to one interval on top; the no-new-frame fast path
  # makes a poll that finds nothing new nearly free (one list call).
  interval_min: 2
  jitter_sec: 30          # ± jitter so the two instances don't fire together

dmi:
  base_url: https://opendataapi.dmi.dk/v1/radardata
  user_agent: dmi-nowcast-sidecar/0.1

forecast:
  # The forecast overlay frames the site's timeline shows, kept on the
  # radar's own 10 min cadence so the scrubber's forecast ticks line up
  # with its history ticks. These are NOT the calibrated probability
  # leads: those are ``national.leads_min`` below and stay 10/20/30/45/60.
  leads_min: [10, 20, 30, 40, 50, 60]
  method: farneback
  steps:
    ensemble_size: 16
    n_cascade_levels: 6
    # 90, not 60: the STEPS horizon counts from the radar frame, while
    # every lead the site serves counts from now. This instance computes
    # on a frame that is already 14-18 min old (DMI's ~12 min publication
    # delay plus the poll interval), so a 60 min horizon left only ~43
    # honest minutes — P(<=45) and P(<=60) read the same final timestep
    # and no ETA past ~43 min could exist. 60 min of served lead plus
    # ~30 min of frame age is the horizon that makes the published leads
    # mean what they say.
    horizon_min: 90
  national:
    # The site's whole payload: probability/ETA/intensity grids + overlays.
    enabled: true
    leads_min: [10, 20, 30, 45, 60]
    keep_cycles: 24

calibration:
  # Seeded from the copy baked into the image on first boot (entrypoint.sh).
  curves_path: /var/lib/dmi-nowcast/calibration_curves.json
  # Pooled national curves — what makes the published probabilities
  # calibrated. This instance does not fit them (the monthly job runs on the
  # private instance, which owns the corpus): copy the fitted file into this
  # volume and restart. Missing file → raw ensemble fractions, truthfully
  # reported as ``calibrated: false`` in the manifest and on /forecast.
  national_curves_path: /var/lib/dmi-nowcast/national_curves.json

server:
  host: 0.0.0.0
  port: 8081              # inside the container; the host port is HOST_PORT
  # THE public switch. Serves only the static frontend, /healthz,
  # /nowcast/*, /forecast; everything else 404s without the bearer below.
  public_mode: true
  # Built SvelteKit site inside the image (see sidecar/deploy/Dockerfile).
  # Absent when the frontend wasn't built before the image: the service logs
  # ``frontend_dir_missing`` and serves the API only.
  frontend_dir: /app/frontend/build
  # Optional operator key. In public_mode it does NOT lock the public
  # surface — it is the only way to reach the hidden one (/state.json,
  # /frames/*, /lightning/*, /docs) for debugging. Leave null and the
  # hidden surface is simply unreachable, which is a fine default for an
  # instance that is meant to publish and nothing else.
  api_key: null
  log_format: json
  log_level: INFO

storage:
  data_dir: /var/lib/dmi-nowcast
  working_cache_max_bytes: 524288000
  # No corpus archiving on the public instance: no bind-mount, no second
  # copy of the frames. The private instance owns the archive and the
  # calibration that derives from it.
  corpus_dir: null

lightning:
  # Off entirely. /lightning/* is hidden by public_mode anyway; disabling it
  # also means no strike buffer in memory and no archive writes (there is no
  # corpus mount to write to). The lightning layer arrives in Phase E.
  enabled: false
  archive_enabled: false

push:
  # Web Push browser notifications (website Phase D). ENABLED on the public
  # instance: the site's whole point is telling a visitor when rain is
  # coming to their point, and a browser notification is the only channel
  # that works when the tab is closed.
  enabled: true
  # REQUIRED when enabled, and the one line you must edit before deploying:
  # the operator contact push services see in the VAPID JWT. Either
  # ``mailto:`` or ``https:``. Placeholder below — change it.
  vapid_subject: mailto:operator@example.com
  # Key and DB default to <storage.data_dir>/push/, i.e. inside this
  # stack's named volume:
  #   /var/lib/dmi-nowcast/push/vapid_private.pem   (0600, auto-generated)
  #   /var/lib/dmi-nowcast/push/subscriptions.sqlite
  # Both survive a restart and a re-deploy; both are lost with the volume,
  # and losing the key forces every subscriber to re-subscribe. Back them
  # up together.
  vapid_private_key_file: null
  db_path: null
  # The ONE knob a subscriber has (Phase G): the horizon. Every entry must
  # be one of forecast.national.leads_min above, or a subscription could
  # be stored for a lead the grids never publish and never warn.
  lead_options: [20, 30, 45, 60]
  min_lead_min: 20
  # The percent each of those horizons warns at is NOT a preference: it is
  # fitted nightly on the private instance and pulled by `sync` below into
  # this file, which the service re-reads without a restart. Missing or
  # unreadable means every horizon warns at 40 %, which is the rule this
  # site shipped before the fit existed.
  thresholds_path: null   # -> /var/lib/dmi-nowcast/push_thresholds.json
  # The bounds and default of the hidden threshold_pct OVERRIDE the
  # subscribe API still accepts. Not offered in the UI any more.
  threshold_options_pct: [40, 60, 80]
  # 40, not 60: on the first observed event P(<=30 min) crossed 40 %
  # with a 23 min ETA but crossed 60 % only ~14 min before the rain,
  # and radar age at compute (13-18 min) eats most of that. It is also
  # the fallback every unfitted horizon uses.
  default_threshold_pct: 40
  default_lead_min: 30
  default_quiet_start: "22:00"
  default_quiet_end: "07:00"
  # Fan-out is sequential inside the cycle, so this is a latency budget as
  # much as a storage one. Raise both together if it is ever reached.
  max_subscriptions: 200
  fanout_budget_s: 20.0
  ttl_s: 900
  rearm_after_min: 60
  # One observation, not two: the calibrated ensemble probability
  # already aggregates 16 members, and a second 10 min observation on
  # top of the radar age left no lead time (2026-09-02 event).
  persistence_obs: 1

station_obs:
  # OFF, and not optional: config load REFUSES station_obs.enabled
  # together with server.public_mode. Gauge polling belongs to the
  # private instance, which owns the corpus volume the observations are
  # written to — this stack has storage.corpus_dir: null and would spend
  # DMI's fair-use budget writing into a container filesystem nobody
  # reads. See sidecar/config.example.yaml for the private instance's
  # settings.
  enabled: false

station_eval:
  # OFF, and not optional either: config load REFUSES
  # station_eval.enabled together with server.public_mode, for the same
  # reason as station_obs above. The gauge scoreboard writes decision
  # rows and its state file under <corpus_dir>/stations/, which this
  # stack does not have, and it measures the service rather than serving
  # anyone. It runs on the private instance beside the replay.
  enabled: false

quality_report:
  # OFF, and not optional: config load REFUSES quality_report.enabled
  # together with server.public_mode. The report is built from the
  # corpora, the gauge store and the warning replay — all on the corpus
  # volume, which this stack does not have (storage.corpus_dir: null).
  # This instance receives the finished document through `sync` below.
  enabled: false

sync:
  # Pull the two files this instance serves but cannot produce, from the
  # private instance over the shared docker network (website Phase F, F4).
  #
  #   nowcast/quality.json            → /var/lib/dmi-nowcast/nowcast/
  #                                     (what GET /nowcast/quality.json serves)
  #   calibration/national_curves.json → calibration.national_curves_path
  #                                     (what makes the published
  #                                      probabilities calibrated)
  #   calibration/push_thresholds.json → push.thresholds_path
  #                                     (what makes the notifications warn
  #                                      at the measured threshold for
  #                                      each horizon, Phase G)
  #
  # LAST GOOD WINS. A refused connection, a 500, or a body that is not the
  # JSON it claims to be leaves the file already on disk untouched: this
  # instance keeps serving yesterday's report, which carries its own
  # generated_at_utc so the page can say how old it is.
  #
  # New curves are re-read at the start of the next radar cycle, and a new
  # threshold table at the start of the next fan-out — no restart, unlike
  # the manual copy this replaces.
  enabled: true
  # Requires the two stacks to share a docker network: deploy with
  # PUBLIC_SHARED_NETWORK=<network> (see docker-compose.shared-net.yml)
  # and use the private container's service name here. Over the LAN
  # instead, an http://<host>:<port> URL works the same way.
  source_url: http://dmi-nowcast-sidecar:8081
  interval_min: 60
  files:
    - nowcast/quality.json
    - calibration/national_curves.json
    - calibration/push_thresholds.json
  timeout_s: 30.0
  # Bearer for the source, when the private instance has server.api_key
  # set. Null on a trusted network, which is the normal case here.
  api_key: null
