# Copy to config.yaml and edit.
#
# Any field can also be set via env vars with the DMI_NOWCAST_ prefix and
# __ as the nested separator. Example: DMI_NOWCAST_SERVER__PORT=9000

home:
  # The reference point this instance nowcasts for — the one whose forecast
  # /state.json carries, and the centre of the rendered crop. Change it to
  # the point you care about. The example value is the geometric centroid
  # of Fyn (the same neutral point the test suite uses).
  lat: 55.33
  lon: 10.32
  radius_km: 1.0          # sampling disc — 1 km matches radar resolution

poll:
  interval_min: 5         # DMI publishes a new composite every ~5 min
  jitter_sec: 30          # ± jitter so we don't stampede on the minute boundary

dmi:
  base_url: https://opendataapi.dmi.dk/v1/radardata
  user_agent: dmi-nowcast-sidecar/0.1

forecast:
  leads_min: [5, 10, 15, 20, 25, 30, 45, 60]
  method: farneback       # farneback (recommended) | tvl1 | mean-motion
  steps:
    ensemble_size: 24
    n_cascade_levels: 6
    # STEPS horizon in minutes, measured from RADAR-FRAME time — not from
    # now. It must cover the longest lead served above (60) PLUS the frame
    # age at compute: DMI publishes a composite ~12 min after its
    # timestamp and the poll adds up to one interval, so the live age is
    # 14-18 min and can reach ~30 after a missed publication. Hence 60 +
    # ~30 = 90. Lower it and the last leads collapse onto the ensemble's
    # final timestep; raise it and STEPS cost grows roughly linearly with
    # ceil(horizon_min / frame spacing).
    # horizon_min: 90

calibration:
  # Sidecar looks for fresh curves in the data volume first; falls back to
  # the curves baked into the image at build time. The monthly
  # recalibration job (calibrate.sh) writes new curves here.
  curves_path: /var/lib/dmi-nowcast/calibration_curves.json

server:
  host: 0.0.0.0
  port: 8081
  api_key: null           # set a shared secret before exposing this anywhere
  log_format: pretty      # pretty (dev) | json (prod / docker / journald)
  log_level: INFO
  # Public (internet-facing) mode. false = this LAN instance: every
  # endpoint open. true = serve ONLY the static frontend, /healthz,
  # /nowcast/* and /forecast; /state.json, /frames/*, /lightning/* and
  # /docs return 404 without an api_key bearer, and the cycle skips the
  # home-crop rendering + basemap fetch. See sidecar/deploy/public/.
  public_mode: false
  # Directory of a built static frontend (SvelteKit build/) served at / with
  # SPA fallback. null = no frontend, API only.
  frontend_dir: null

storage:
  data_dir: /var/lib/dmi-nowcast
  # Working cache (data_dir/composites) is LRU-evicted after each cycle so
  # disk stays bounded. 500 MB ≈ ~21 days of frames at ~80 KB.
  working_cache_max_bytes: 524288000
  # Persistent corpus archive.
  # Every fetched composite is copied here in addition to the working
  # cache. Use a host bind-mount in docker-compose.yml so the archive
  # survives ``docker compose down -v``. Set to null to disable.
  corpus_dir: /var/lib/dmi-nowcast-corpus

lightning:
  # Blitzortung lightning-ETA. HA pushes strikes to POST /lightning/strikes;
  # GET /lightning/eta?lat=&lon=&rings=3,10 returns ETA of the threatening
  # cell's leading edge to each ring. No DMI radar involved — works anywhere
  # Blitzortung detects (so the Pixel ETA works outside Denmark too).
  enabled: true
  buffer_window_min: 30     # rolling strike buffer depth
  rings_km: [3.0, 10.0]     # imminent + early-warning rings
  min_strikes: 6            # below this -> "insufficient_data"
  cluster_eps_km: 15.0      # single-linkage cell clustering radius
  relevance_radius_km: 60.0 # ignore strikes/cells beyond this from the target
  leading_edge_recent_min: 5.0  # "leading edge" = closest of strikes this recent
  min_closing_kmh: 5.0      # below this closing speed -> "stalled"
  min_fit_span_min: 3.0     # min time spread for a trusted velocity fit
  max_buffer: 2000          # hard cap on buffered strikes
  # Cross-cycle EMA smoothing of the ETA (closing speed + leading edge) per
  # target — damps the whipsaw from refitting sparse strikes each cycle.
  # Applied only to /lightning/eta (sensors/alerts); the debug map stays raw.
  smoothing_enabled: true
  smoothing_tau_min: 3.0    # EMA time constant (larger = smoother/slower)
  smoothing_max_gap_min: 10.0  # reset smoothing if no update for this long
  # Persist every received strike (append-only NDJSON, one file per UTC day)
  # on the corpus bind-mount, for later backtesting/calibration.
  archive_enabled: true
  archive_dir: /var/lib/dmi-nowcast-corpus/strikes

# Web Push browser notifications (website Phase D). Off by default: this
# LAN instance has Home Assistant for alerting. Turning it on makes the
# process hold a VAPID private key and a SQLite table of subscriptions,
# both under storage.data_dir/push/ (0600 / 0700).
#
# push:
#   enabled: true
#   # Operator contact in the VAPID JWT — required when enabled. Either
#   # mailto: or https:. Push services may throttle a sender without one.
#   vapid_subject: mailto:you@example.com
#   # Both default to <storage.data_dir>/push/. Set only to move them.
#   vapid_private_key_file: null   # -> /var/lib/dmi-nowcast/push/vapid_private.pem
#   db_path: null                  # -> /var/lib/dmi-nowcast/push/subscriptions.sqlite
#   # Offered lead times are forecast.national.leads_min at or above this.
#   min_lead_min: 20
#   threshold_options_pct: [40, 60, 80]
#   default_threshold_pct: 60
#   default_lead_min: 30
#   default_quiet_start: "22:00"
#   default_quiet_end: "07:00"
#   max_subscriptions: 200
#   # SSRF guard: the only hosts this service will POST a notification to.
#   allowed_endpoint_host_suffixes:
#     - fcm.googleapis.com
#     - updates.push.services.mozilla.com
#     - push.services.mozilla.com
#     - web.push.apple.com
#     - notify.windows.com
#   ttl_s: 900              # push service holds an undelivered message this long
#   fanout_budget_s: 20.0   # per-cycle wall-clock budget for the fan-out
#   rearm_after_min: 60     # dry minutes before a notified subscription re-arms
#   persistence_obs: 2      # consecutive over-threshold observations to fire

# --- Rain-gauge polling (Phase F) -------------------------------------
# Mirrors DMI metObs station observations into
# <storage.corpus_dir>/stations/obs/YYYY/MM.parquet, which is the gauge
# truth scripts/join_gauge_truth.py joins onto the calibration corpus.
# Without it the benchmark verifies the radar against the radar.
#
# ON for this (LAN / private) instance: it is the one that owns the
# corpus volume and runs the calibration jobs. The public instance MUST
# leave it off — config load refuses the combination outright, because
# there is no corpus mount there to write to.
#
station_obs:
  enabled: true
  # Cadence and window. The 40 min lookback deliberately overlaps four
  # polls: DMI backfills late station reports into slots that already
  # passed, and the store dedupes on (station_id, observed_utc,
  # parameter_id), so re-reading a slot is free and a missed poll heals
  # itself on the next one. lookback_min must be >= interval_min.
  interval_min: 10
  lookback_min: 40
  # precip_past10min is the amount (0.1 mm resolution, ~112 Danish
  # stations); precip_dur_past10min is minutes-with-precipitation in the
  # same slot, which is what rescues drizzle below the amount floor.
  parameters:
    - precip_past10min
    - precip_dur_past10min
  base_url: https://opendataapi.dmi.dk/v2/metObs
  # Optional. DMI stopped requiring API keys on opendataapi.dmi.dk on
  # 2025-12-02, so null is correct by policy, not by luck. Sent as
  # X-Gravitee-Api-Key when set.
  api_key: null

# Gauge scoreboard (Phase F). A virtual subscriber at every DMI rain
# gauge, evaluated once per cycle by the same push decision engine the
# real subscriptions go through, appended to
# <corpus_dir>/stations/eval/YYYY/MM.parquet in the same row shape
# scripts/replay_warnings.py writes for history. Turn it on and the
# historical replay and the live record become one continuous table.
#
# OFF by default. Private instance only: config load refuses the
# combination with server.public_mode, and requires storage.corpus_dir.
#
# station_eval:
#   enabled: true
#   # {"version": 2, "points": [{"id": "06180", "lat": ..., "lon": ...}]}
#   # from scripts/build_station_points.py.
#   points_file: /var/lib/dmi-nowcast-corpus/stations/station_points.json
#   # The live subscriber row: warn at 40 % of rain within 30 min, one
#   # observation of persistence, 60 min disarmed after a warning.
#   # lead_min must be one of forecast.national.leads_min.
#   rules:
#     threshold_pct: 40
#     lead_min: 30
#     rearm_after_min: 60
#     persistence_obs: 1
