[project]
name = "dmi-nowcast-core"
version = "0.1.0"
description = "Radar nowcasting algorithm library for DMI Open Data composites"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nicolai Damslund" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "h5py>=3.11",
    "numpy>=1.26",
    "pyproj>=3.6",
    "opencv-python-headless>=4.10",
    "scipy>=1.13",
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "matplotlib>=3.8",
    "pyarrow>=17.0",
    "duckdb>=1.5.5",
]
# NOTE: upstream ``pysteps`` is deliberately NOT a dependency. The STEPS
# subset this project needs is vendored under
# ``src/dmi_nowcast_core/_vendor/pysteps_steps/`` (BSD-3, notices kept):
# pysteps has no wheels for musl targets and its source build wants an
# OpenMP-capable compiler, which made it unusable in the environments
# this code has to run in. See that directory's NOTICE.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmi_nowcast_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
